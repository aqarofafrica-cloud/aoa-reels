name: voices
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: previews-branch
  cancel-in-progress: false
jobs:
  voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (time-limited, with fallbacks)
        run: bash scripts/install_tools.sh
      - name: Render voice casting
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/voice_samples.py
