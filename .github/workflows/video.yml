name: video
on:
  repository_dispatch:
    types: [vframes, vrender]
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (time-limited, with fallbacks)
        run: bash scripts/install_tools.sh
      - name: Run video job
        run: python3 scripts/video_pipeline.py
