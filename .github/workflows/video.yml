name: video
on:
  repository_dispatch:
    types: [vframes, vrender]
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg fonts-dejavu-core >/dev/null
          pip install --quiet pillow==10.4.0
      - name: Run video job
        run: python3 scripts/video_pipeline.py
