name: tips
on:
  repository_dispatch:
    types: [tips]
permissions:
  contents: write
jobs:
  tips:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg fonts-dejavu-core libraqm0 libfribidi0 >/dev/null
          pip install --quiet pillow==10.4.0
      - name: Build tips content
        run: python3 scripts/tips_pipeline.py
