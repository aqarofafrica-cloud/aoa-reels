name: tips2
on:
  repository_dispatch:
    types: [tipsdoc, tips2]
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload (manual test)"
        required: true
permissions:
  contents: write
concurrency:
  group: previews-branch
  cancel-in-progress: false
jobs:
  tips2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (time-limited, with fallbacks)
        env:
          PIP_EXTRA: weasyprint==70.0
        run: bash scripts/install_tools.sh fonts-noto-core libraqm0 libfribidi0 libpango-1.0-0 libpangoft2-1.0-0
      - name: Run advice job
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NUELINK_API_KEY: ${{ secrets.NUELINK_API_KEY }}
        run: python3 scripts/tips2_pipeline.py
