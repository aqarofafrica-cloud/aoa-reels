name: tips2
on:
  repository_dispatch:
    types: [tipsdoc, tips2]
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload (manual test)"
        required: true
permissions:
  contents: write
concurrency:
  group: previews-branch
  cancel-in-progress: false
jobs:
  tips2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0 libfribidi0 libpango-1.0-0 libpangoft2-1.0-0 >/dev/null
          pip install --quiet pillow==10.4.0 weasyprint==70.0
      - name: Run advice job
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NUELINK_API_KEY: ${{ secrets.NUELINK_API_KEY }}
        run: python3 scripts/tips2_pipeline.py
