name: tips2
on:
  repository_dispatch:
    types: [tipsdoc, tips2]
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload (manual test)"
        required: true
permissions:
  contents: write
concurrency:
  group: previews-branch
  cancel-in-progress: false
jobs:
  tips2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          # retry with time limits: a stuck package mirror must not block the job
          for i in 1 2 3; do
            timeout 180 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -y >/dev/null \
            && timeout 480 sudo apt-get -o Acquire::Retries=3 install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0 libfribidi0 libpango-1.0-0 libpangoft2-1.0-0 >/dev/null \
            && break
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          command -v ffmpeg
          pip install --quiet pillow==10.4.0 weasyprint==70.0
      - name: Run advice job
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NUELINK_API_KEY: ${{ secrets.NUELINK_API_KEY }}
        run: python3 scripts/tips2_pipeline.py
