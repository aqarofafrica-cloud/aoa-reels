name: tips2
on:
  repository_dispatch:
    types: [tipsdoc, tips2]
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload (manual test)"
        required: true
permissions:
  contents: write
concurrency:
  group: previews-branch
  cancel-in-progress: false
jobs:
  tips2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Python packages
        run: pip install --quiet --retries 3 --timeout 30 pillow==10.4.0 weasyprint==70.0 matplotlib==3.9.2
      - name: System packages (apt, time-limited)
        timeout-minutes: 6
        continue-on-error: true
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -y >/dev/null
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0 libfribidi0 libpango-1.0-0 libpangoft2-1.0-0 >/dev/null
      - name: Fallback tools (when the package mirror is down)
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "apt unavailable: static ffmpeg"
            curl -sSL --retry 4 --max-time 300 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo tar -xJf /tmp/ff.tar.xz -C /opt
            sudo ln -sf /opt/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
            sudo ln -sf /opt/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/ffprobe
          fi
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            echo "apt unavailable: DejaVu fonts from matplotlib"
            src=$(python3 -c "import matplotlib, os; print(os.path.join(os.path.dirname(matplotlib.__file__), 'mpl-data/fonts/ttf'))")
            sudo mkdir -p /usr/share/fonts/truetype/dejavu
            sudo cp "$src"/DejaVuSans*.ttf /usr/share/fonts/truetype/dejavu/
            sudo fc-cache -f >/dev/null || true
          fi
          ffmpeg -version | head -1
          ls /usr/share/fonts/truetype/dejavu/
      - name: Run advice job
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NUELINK_API_KEY: ${{ secrets.NUELINK_API_KEY }}
        run: python3 scripts/tips2_pipeline.py
