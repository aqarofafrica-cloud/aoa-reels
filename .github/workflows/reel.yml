name: reel
on:
  repository_dispatch:
    types: [reel]
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload (tests)"
        required: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg fonts-dejavu-core >/dev/null
          pip install --quiet pillow==10.4.0
      - name: Build and publish reel
        env:
          MAKE_HOOK_URL: ${{ secrets.MAKE_HOOK_URL }}
        run: python3 scripts/pipeline.py
