name: reel
on:
  repository_dispatch:
    types: [reel]
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON payload (tests)"
        required: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools (time-limited, with fallbacks)
        run: bash scripts/install_tools.sh
      - name: Build and publish reel
        env:
          MAKE_HOOK_URL: ${{ secrets.MAKE_HOOK_URL }}
        run: python3 scripts/pipeline.py
